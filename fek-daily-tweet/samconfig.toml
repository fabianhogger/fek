version = 0.1

[default.global.parameters]
stack_name = "fek-daily-tweet"

[default.build.parameters]
# pip resolves the aarch64 wheels correctly on this machine, so a plain build works
# and does not need Docker running. Switch to true if a dependency ever ships a
# platform-specific wheel that pip picks wrong for arm64.
use_container = false

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "eu-central-1"
# Deploy with DryRun=true first, read the CloudWatch output, then flip it.
parameter_overrides = "DryRun=true ScheduleEnabled=ENABLED"

[default.sync.parameters]
watch = false
