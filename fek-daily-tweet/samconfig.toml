version = 0.1

[default.global.parameters]
stack_name = "fek-daily-tweet"

[default.build.parameters]
# Docker gives you the right arm64 wheels regardless of your build machine.
# Drop this if Docker is not running; pip usually resolves them correctly anyway.
use_container = true

[default.deploy.parameters]
capabilities = "CAPABILITY_IAM"
confirm_changeset = true
resolve_s3 = true
region = "eu-central-1"
# Deploy with DryRun=true first, read the CloudWatch output, then flip it.
parameter_overrides = "DryRun=true ScheduleEnabled=ENABLED"

[default.sync.parameters]
watch = false
